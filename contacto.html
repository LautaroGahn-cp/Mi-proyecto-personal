<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets_3/wii.png">
</head>
<body class="reseña">
    <div class="contenedor">
        <header><h1>Reseña</h1></header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
            </ul>
        </nav>
        <main>
            <h2>Escribe un comentario.</h2>
            <form action>
                <fieldset>
                    <legend>Comentario</legend>
                    <label for="Nombre">Nombre</label>
                    <br>
                    <input type="text" placeholder="Ingrese Nombre">
                    <br>
                    <label for="Correo">Correo Electronico</label>
                    <br>
                    <input type="text" placeholder="Ingrese Correo">
                    <br>
                    <label for="Reseña">Reseña</label>
                    <br>
                    <textarea cols="30" rows="5" placeholder="Escriba aqui..." ></textarea><br>
                </fieldset>
                <input type="Submit" value="Enviar" class="E">
                    <br>
                <input type="submit" value="Limpiar" class="L">
                    <br>
            </form>
        </main>
        <footer>
            <h4>Autor © 2026 Lautaro Gahn | Todos los derechos reservados</h4>
        </footer>
    </div>
</body>
</html>
